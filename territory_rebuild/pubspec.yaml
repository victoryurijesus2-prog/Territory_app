name: territory_app
description: TerritoryApp — conquiste a cidade correndo
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0
  sqflite: ^2.4.3
  path: ^1.9.1

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3

  # Mapa
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # GPS
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # State management
  flutter_riverpod: ^2.5.1

  # UI / Animações
  lottie: ^3.1.0
  confetti: ^0.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Notificações
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Utilitários
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
